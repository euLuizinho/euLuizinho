name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"   # roda a cada 6 horas
  workflow_dispatch:         # permite rodar manualmente
  push:
    branches:
      - main                # ajuste se sua branch principal tiver outro nome

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake game from a github user contributions grid
        uses: Platane/snk@v3
        with:
          github_user_name: euLuizinho
          outputs: |
            dist/github-snake-dark.svg?color_snake=%23FF2E93&color_dots=%23161b22,%233f3f4e,%239d174d,%23f472b6,%23ffffff&palette=github-dark
            dist/github-snake.svg?color_snake=%23FF2E93&color_dots=%23ebedf0,%23d4d4d8,%23f9a8d4,%23f472b6,%2318181b

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
