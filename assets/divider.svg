<svg xmlns="http://www.w3.org/2000/svg" width="900" height="20" viewBox="0 0 900 20">
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B30FF" stop-opacity="0"/>
      <stop offset="15%" stop-color="#9B30FF"/>
      <stop offset="40%" stop-color="#39FF14"/>
      <stop offset="60%" stop-color="#39FF14"/>
      <stop offset="85%" stop-color="#FF003C"/>
      <stop offset="100%" stop-color="#FF003C" stop-opacity="0"/>
    </linearGradient>
    <filter id="suitGlow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main gradient line -->
  <line x1="50" y1="10" x2="850" y2="10" stroke="url(#line)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Center suit symbols with glow -->
  <text x="370" y="14" font-size="11" fill="#9B30FF" filter="url(#suitGlow)" opacity="0.7">♠</text>
  <text x="420" y="14" font-size="11" fill="#FF003C" filter="url(#suitGlow)" opacity="0.7">♥</text>
  <text x="470" y="14" font-size="11" fill="#39FF14" filter="url(#suitGlow)" opacity="0.7">♣</text>
  <text x="520" y="14" font-size="11" fill="#FF003C" filter="url(#suitGlow)" opacity="0.7">♦</text>
</svg>
