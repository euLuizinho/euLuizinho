    <path d="M 0,-3.5 C -2,-8.5 -10,-8 -10,-1.5 C -10,4.5 -3.5,8 0,11 C 3.5,8 10,4.5 10,-1.5 C 10,-8 2,-8.5 0,-3.5 Z" fill="#0B0B10" stroke="#F9A8D4" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
