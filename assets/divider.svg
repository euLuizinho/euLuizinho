<svg xmlns="http://www.w3.org/2000/svg" width="900" height="40" viewBox="0 0 900 40">
  <defs>
    <linearGradient id="pillBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181F" stop-opacity="0"/>
      <stop offset="12%" stop-color="#2A2A35"/>
      <stop offset="36%" stop-color="#FF2E93"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="64%" stop-color="#F472B6"/>
      <stop offset="88%" stop-color="#2A2A35"/>
      <stop offset="100%" stop-color="#18181F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pillGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="15%" stop-color="#FF2E93" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF2E93" stop-opacity="0.32"/>
      <stop offset="85%" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Style 2 Signature Glowing Gradient Pill Divider -->
  <rect x="70" y="14" width="760" height="12" rx="6" fill="url(#pillGlow)"/>
  <rect x="30" y="17" width="840" height="6" rx="3" fill="url(#pillBar)"/>

