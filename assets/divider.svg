  </g>

  <!-- Center Hollow Heart Medallion -->
  <circle cx="450" cy="20" r="15" fill="#09090D" stroke="#FF2E93" stroke-width="1.6"/>
  <g transform="translate(450, 19) scale(0.92)">
    <path d="M 0,-3.5 C -2,-8.5 -10,-8 -10,-1.5 C -10,4.5 -3.5,8 0,11 C 3.5,8 10,4.5 10,-1.5 C 10,-8 2,-8.5 0,-3.5 Z" fill="none" stroke="#FFFFFF" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round"/>
