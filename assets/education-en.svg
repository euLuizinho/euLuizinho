      <text x="38" y="128" font-family="'Segoe UI', sans-serif" font-size="11.8" fill="#F4F4F5"><tspan fill="#F9A8D4">♡</tspan> Top <tspan fill="#FFFFFF" font-weight="700">100/100</tspan> score in iOS Swift (GS 2026.2)</text>
