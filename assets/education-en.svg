      <text x="478" y="128" font-family="'Segoe UI', sans-serif" font-size="11.8" fill="#F4F4F5"><tspan fill="#FFFFFF">♡</tspan> <tspan fill="#FFFFFF" font-weight="700">1,440h</tspan> technical core + 120h CyberSides capstone</text>
