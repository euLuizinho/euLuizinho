<svg xmlns="http://www.w3.org/2000/svg" width="900" height="266" viewBox="0 0 900 266">
  <defs>
    <linearGradient id="fgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06060A"/>
      <stop offset="52%" stop-color="#15151E"/>
      <stop offset="100%" stop-color="#3E0E2A"/>
    </linearGradient>
    <linearGradient id="fgCardRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141D" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#271221" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="fgCardSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13131B" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#1E1E28" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="fgSweep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E93" stop-opacity="0.18"/>
      <stop offset="48%" stop-color="#FF2E93"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <clipPath id="fgClip">
      <rect x="1" y="1" width="898" height="264" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#fgClip)">
    <rect width="900" height="266" fill="url(#fgCanvas)"/>

    <path d="M0,224 C190,145 385,258 615,152 C740,94 826,118 900,56 L900,266 L0,266 Z" fill="#1C1C27" opacity="0.82"/>
    <path d="M120,266 C340,200 540,255 760,156 C830,124 872,135 900,104 L900,266 Z" fill="#2F1124" opacity="0.58"/>
    <path d="M-20,218 C185,138 360,215 560,120 C705,52 810,82 920,28" fill="none" stroke="url(#fgSweep)" stroke-width="5.5" opacity="0.72"/>
    <path d="M40,248 C255,180 465,232 685,138 C795,90 855,108 920,76" fill="none" stroke="#F472B6" stroke-width="2" opacity="0.55"/>

    <circle cx="450" cy="133" r="64" fill="#FF2E93" opacity="0.14"/>
    <circle cx="860" cy="40" r="44" fill="#FF2E93" opacity="0.18"/>
    <circle cx="46" cy="230" r="36" fill="#FFFFFF" opacity="0.06"/>

    <!-- Card 1: Applied AI -->
    <g>
      <rect x="20" y="18" width="420" height="108" rx="16" fill="url(#fgCardRose)" stroke="#FF2E93" stroke-width="1.2" stroke-opacity="0.75"/>
      <circle cx="408" cy="96" r="28" fill="#FF2E93" opacity="0.10"/>
      <text x="38" y="47" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Applied AI &amp; Agents</text>
      <rect x="312" y="29" width="110" height="22" rx="11" fill="#FF2E93"/>
      <text x="367" y="43.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">AZURE · YOLOv8</text>
      <text x="38" y="75" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#F4F4F5"><tspan fill="#FF2E93">✦</tspan> Prompting, Orchestration &amp; Structured Outputs</text>
      <text x="38" y="98" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#D4D4D8"><tspan fill="#F9A8D4">♡</tspan> LGPD Privacy, Human-in-the-Loop &amp; OpenCV</text>
      <g transform="translate(414, 102) rotate(-12) scale(0.65)">
        <path d="M 0,-3.5 C -2,-8.5 -10,-8 -10,-1.5 C -10,4.5 -3.5,8 0,11 C 3.5,8 10,4.5 10,-1.5 C 10,-8 2,-8.5 0,-3.5 Z" fill="none" stroke="#FF2E93" stroke-width="2.1" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Card 2: Tech Product -->
    <g>
      <rect x="460" y="18" width="420" height="108" rx="16" fill="url(#fgCardSlate)" stroke="#F472B6" stroke-width="1.15" stroke-opacity="0.72"/>
      <circle cx="848" cy="96" r="28" fill="#F472B6" opacity="0.10"/>
      <text x="478" y="47" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Tech Product &amp; Strategy</text>
      <rect x="752" y="29" width="110" height="22" rx="11" fill="#FFFFFF"/>
      <text x="807" y="43.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="800" fill="#09090D">DISCOVERY · MVP</text>
      <text x="478" y="75" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#F4F4F5"><tspan fill="#F472B6">✦</tspan> Agile Canvas, SWOT, Porter &amp; Unit Economics</text>
      <text x="478" y="98" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#D4D4D8"><tspan fill="#FFFFFF">♡</tspan> Bridging business pain points &amp; Mermaid flows</text>
      <path d="M 854,94 Q 856.2,100.8 863,103 Q 856.2,105.2 854,112 Q 851.8,105.2 845,103 Q 851.8,100.8 854,94 Z" fill="none" stroke="#F9A8D4" stroke-width="1.35" stroke-linejoin="round"/>
    </g>

    <!-- Card 3: Data & BI -->
    <g>
      <rect x="20" y="140" width="420" height="108" rx="16" fill="url(#fgCardSlate)" stroke="#FFFFFF" stroke-width="0.95" stroke-opacity="0.45"/>
      <circle cx="408" cy="218" r="28" fill="#FFFFFF" opacity="0.06"/>
      <text x="38" y="169" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Data, BI &amp; Analytics</text>
      <rect x="310" y="151" width="112" height="22" rx="11" fill="#2A2A35" stroke="#F472B6" stroke-width="0.8"/>
      <text x="366" y="165.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#F9A8D4">STAR SCHEMA · SQL</text>
      <text x="38" y="197" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#F4F4F5"><tspan fill="#FFFFFF">✦</tspan> Dimensional Modeling (Fact/Dim) &amp; Storage Sizing</text>
      <text x="38" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#D4D4D8"><tspan fill="#F472B6">♡</tspan> Analytical SQL, Executive KPIs, Power BI &amp; DAX</text>
      <path d="M 414,214 Q 416.2,220.8 423,223 Q 416.2,225.2 414,232 Q 411.8,225.2 405,223 Q 411.8,220.8 414,214 Z" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linejoin="round" opacity="0.8"/>
    </g>

    <!-- Card 4: Cloud Ops -->
    <g>
      <rect x="460" y="140" width="420" height="108" rx="16" fill="url(#fgCardRose)" stroke="#A1A1AA" stroke-width="1.0" stroke-opacity="0.55"/>
      <circle cx="848" cy="218" r="28" fill="#F9A8D4" opacity="0.09"/>
      <text x="478" y="169" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Cloud Ops &amp; Multistack</text>
      <rect x="752" y="151" width="110" height="22" rx="11" fill="#F472B6"/>
      <text x="807" y="165.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="800" fill="#09090D">AWS · LINUX · API</text>
      <text x="478" y="197" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#F4F4F5"><tspan fill="#D4D4D8">✦</tspan> AWS (Lambda, DDB, EC2), SSH, Docker &amp; Redis</text>
      <text x="478" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#D4D4D8"><tspan fill="#FF2E93">♡</tspan> Python, Kotlin, Java, Flutter, Swift &amp; React</text>
      <g transform="translate(854, 224) rotate(12) scale(0.65)">
        <path d="M 0,-3.5 C -2,-8.5 -10,-8 -10,-1.5 C -10,4.5 -3.5,8 0,11 C 3.5,8 10,4.5 10,-1.5 C 10,-8 2,-8.5 0,-3.5 Z" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linejoin="round" opacity="0.88"/>
      </g>
    </g>

    <circle cx="450" cy="133" r="14" fill="#0B0B10" stroke="#FF2E93" stroke-width="1.5"/>
    <path d="M 450,124 Q 452.5,130.5 459,133 Q 452.5,135.5 450,142 Q 447.5,135.5 441,133 Q 447.5,130.5 450,124 Z" fill="#FFFFFF"/>
  </g>

  <rect x="1" y="1" width="898" height="264" rx="14" fill="none" stroke="#4A223A" stroke-width="1.3"/>
</svg>
