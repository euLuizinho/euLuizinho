<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060609"/>
      <stop offset="52%" stop-color="#171720"/>
      <stop offset="100%" stop-color="#440D2D"/>
    </linearGradient>
    <radialGradient id="pinkGlow" cx="82%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#FF2E93" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#EC4899" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FF2E93" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="softGlow" cx="62%" cy="85%" r="35%">
      <stop offset="0%" stop-color="#F9A8D4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F9A8D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbonMain" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E93" stop-opacity="0.12"/>
      <stop offset="48%" stop-color="#FF2E93"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="ribbonSoft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#F472B6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FBCFE8" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="frameClip">
      <rect x="1" y="1" width="898" height="218" rx="14"/>
    </clipPath>
    <style>
      @keyframes twinkle {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.38; }
      }
      @keyframes floatSoft {
        0%, 100% { opacity: 0.88; }
        50% { opacity: 0.52; }
      }
      .twinkle { animation: twinkle 3.4s ease-in-out infinite; }
      .twinkleSlow { animation: twinkle 4.6s ease-in-out infinite; }
      .heartPulse { animation: floatSoft 4s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#frameClip)">
    <!-- Deep Background & Glows -->
    <rect width="900" height="220" fill="url(#bg)"/>
    <rect width="900" height="220" fill="url(#pinkGlow)"/>
    <rect width="900" height="220" fill="url(#softGlow)"/>

    <!-- Flowing Frutiger Metro Layered Waves -->
    <path d="M0,196 C190,136 390,224 615,126 C735,72 825,94 900,38 L900,220 L0,220 Z" fill="#121218" opacity="0.86"/>
    <path d="M180,220 C395,186 555,222 720,145 C805,105 860,118 900,82 L900,220 Z" fill="#1E1420" opacity="0.55"/>

    <!-- Vector Bloom Ribbons -->
    <path d="M295,220 C480,152 625,46 900,72" fill="none" stroke="url(#ribbonMain)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M360,220 C535,168 675,78 900,102" fill="none" stroke="url(#ribbonSoft)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M445,220 C600,185 730,118 900,134" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.38" stroke-linecap="round"/>

    <!-- Glossy-Flat Translucent Vector Circles -->
    <circle cx="778" cy="82" r="46" fill="#FF2E93" opacity="0.16"/>
    <circle cx="820" cy="116" r="28" fill="#FFFFFF" opacity="0.12"/>
    <circle cx="732" cy="134" r="18" fill="none" stroke="#F9A8D4" stroke-width="1.4" opacity="0.75"/>
    <circle cx="662" cy="158" r="9" fill="none" stroke="#FFFFFF" stroke-width="1.1" opacity="0.45"/>

    <!-- Halftone Dots -->
    <g fill="#F472B6" opacity="0.34">
      <circle cx="570" cy="34" r="2.3"/><circle cx="586" cy="34" r="2.3"/><circle cx="602" cy="34" r="2.3"/><circle cx="618" cy="34" r="2.3"/>
      <circle cx="578" cy="48" r="1.8"/><circle cx="594" cy="48" r="1.8"/><circle cx="610" cy="48" r="1.8"/><circle cx="626" cy="48" r="1.8"/>
      <circle cx="586" cy="62" r="1.4"/><circle cx="602" cy="62" r="1.4"/><circle cx="618" cy="62" r="1.4"/>
    </g>

    <!-- Hollow Vector Hearts (Corações Vazados) -->
    <!-- Hero hollow heart (white/pink double outline) -->
    <g transform="translate(778, 80) rotate(-10) scale(1.65)" class="heartPulse">
      <path d="M 0,6.5 C -1.5,4.8 -9,0 -9,-4.5 C -9,-7.8 -6.3,-10 -3.4,-10 C -1.6,-10 -0.4,-9.1 0,-7.8 C 0.4,-9.1 1.6,-10 3.4,-10 C 6.3,-10 9,-7.8 9,-4.5 C 9,0 1.5,4.8 0,6.5 Z" fill="none" stroke="#FFFFFF" stroke-width="1.35" stroke-linejoin="round"/>
    </g>
    <!-- Medium hollow heart (hot pink) -->
    <g transform="translate(698, 126) rotate(12) scale(1.15)">
      <path d="M 0,6.5 C -1.5,4.8 -9,0 -9,-4.5 C -9,-7.8 -6.3,-10 -3.4,-10 C -1.6,-10 -0.4,-9.1 0,-7.8 C 0.4,-9.1 1.6,-10 3.4,-10 C 6.3,-10 9,-7.8 9,-4.5 C 9,0 1.5,4.8 0,6.5 Z" fill="none" stroke="#FF2E93" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
    <!-- Small hollow heart (pastel pink) -->
    <g transform="translate(848, 148) rotate(-14) scale(0.9)">
      <path d="M 0,6.5 C -1.5,4.8 -9,0 -9,-4.5 C -9,-7.8 -6.3,-10 -3.4,-10 C -1.6,-10 -0.4,-9.1 0,-7.8 C 0.4,-9.1 1.6,-10 3.4,-10 C 6.3,-10 9,-7.8 9,-4.5 C 9,0 1.5,4.8 0,6.5 Z" fill="none" stroke="#F9A8D4" stroke-width="1.7" stroke-linejoin="round"/>
    </g>
    <!-- Delicate micro hollow heart near subtitle -->
    <g transform="translate(642, 74) rotate(-8) scale(0.75)">
      <path d="M 0,6.5 C -1.5,4.8 -9,0 -9,-4.5 C -9,-7.8 -6.3,-10 -3.4,-10 C -1.6,-10 -0.4,-9.1 0,-7.8 C 0.4,-9.1 1.6,-10 3.4,-10 C 6.3,-10 9,-7.8 9,-4.5 C 9,0 1.5,4.8 0,6.5 Z" fill="none" stroke="#F472B6" stroke-width="1.8" stroke-linejoin="round"/>
    </g>

    <!-- 4-Point Vector Bloom Stars (Solid & Hollow) -->
    <path d="M 692,36 Q 694.5,48.5 707,51 Q 694.5,53.5 692,66 Q 689.5,53.5 677,51 Q 689.5,48.5 692,36 Z" fill="#FFFFFF" class="twinkle"/>
    <path d="M 852,32 Q 853.8,41.2 863,43 Q 853.8,44.8 852,54 Q 850.2,44.8 841,43 Q 850.2,41.2 852,32 Z" fill="none" stroke="#F9A8D4" stroke-width="1.35" class="twinkleSlow"/>
    <path d="M 738,162 Q 739.5,170.5 748,172 Q 739.5,173.5 738,182 Q 736.5,173.5 728,172 Q 736.5,170.5 738,162 Z" fill="#FF2E93"/>
    <path d="M 616,104 Q 617.2,110.8 624,112 Q 617.2,113.2 616,120 Q 614.8,113.2 608,112 Q 614.8,110.8 616,104 Z" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8"/>
    <path d="M 822,182 Q 823.2,187.8 829,189 Q 823.2,190.2 822,196 Q 820.8,190.2 815,189 Q 820.8,187.8 822,182 Z" fill="#FFFFFF" opacity="0.75"/>

    <!-- Typography (Left) -->
    <text x="44" y="92" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.8">LUIZ FABIANO</text>
    <text x="44" y="124" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#F9A8D4">
      Visão Sistêmica  ·  IA Aplicada, Produto Tech, Dados &amp; Cloud
    </text>
    <text x="44" y="154" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#A1A1AA">
      @euLuizinho  ·  FIAP SI (Jul/2027)  ·  Técnico ETEC  ·  São Paulo, BR
    </text>
  </g>

  <rect x="1" y="1" width="898" height="218" rx="14" fill="none" stroke="#422036" stroke-width="1.2"/>
</svg>
