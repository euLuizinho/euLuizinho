<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <!-- Background gradient: deep dark with purple/green/red aura -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="30%" stop-color="#1a0a2e"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="70%" stop-color="#1a0a0a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <!-- Purple neon glow (Joker side) -->
    <radialGradient id="glowPurple" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#9B30FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#9B30FF" stop-opacity="0"/>
    </radialGradient>
    <!-- Green neon glow (Joker accent) -->
    <radialGradient id="glowGreen" cx="40%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </radialGradient>
    <!-- Red neon glow (Harley side) -->
    <radialGradient id="glowRed" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#FF003C" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF003C" stop-opacity="0"/>
    </radialGradient>
    <!-- Bottom wave -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B30FF"/>
      <stop offset="40%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#FF003C"/>
    </linearGradient>
    <!-- Text glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSuit">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)"/>
  <rect width="900" height="200" fill="url(#glowPurple)"/>
  <rect width="900" height="200" fill="url(#glowGreen)"/>
  <rect width="900" height="200" fill="url(#glowRed)"/>

  <!-- Subtle HA HA watermark -->
  <text x="80" y="50" font-family="Impact, Arial Black, sans-serif" font-size="28" fill="#9B30FF" opacity="0.06" transform="rotate(-15, 80, 50)">HA!</text>
  <text x="200" y="85" font-family="Impact, Arial Black, sans-serif" font-size="22" fill="#39FF14" opacity="0.05" transform="rotate(-12, 200, 85)">HA!</text>
  <text x="680" y="45" font-family="Impact, Arial Black, sans-serif" font-size="26" fill="#FF003C" opacity="0.06" transform="rotate(10, 680, 45)">HA!</text>
  <text x="790" y="78" font-family="Impact, Arial Black, sans-serif" font-size="20" fill="#FF003C" opacity="0.05" transform="rotate(15, 790, 78)">HA!</text>
  <text x="380" y="38" font-family="Impact, Arial Black, sans-serif" font-size="18" fill="#9B30FF" opacity="0.04" transform="rotate(-8, 380, 38)">HA!</text>

  <!-- Corner diamond accents -->
  <!-- Top-left diamond (purple) -->
  <polygon points="30,15 40,5 50,15 40,25" fill="none" stroke="#9B30FF" stroke-width="1" opacity="0.3"/>
  <!-- Top-right diamond (red) -->
  <polygon points="860,15 870,5 880,15 870,25" fill="none" stroke="#FF003C" stroke-width="1" opacity="0.3"/>
  <!-- Bottom-left small diamond -->
  <polygon points="20,180 26,174 32,180 26,186" fill="#9B30FF" opacity="0.15"/>
  <!-- Bottom-right small diamond -->
  <polygon points="868,180 874,174 880,180 874,186" fill="#FF003C" opacity="0.15"/>

  <!-- Decorative suit symbols scattered -->
  <text x="120" y="170" font-size="14" fill="#9B30FF" opacity="0.12" filter="url(#glowSuit)">♠</text>
  <text x="260" y="185" font-size="12" fill="#39FF14" opacity="0.10" filter="url(#glowSuit)">♣</text>
  <text x="640" y="175" font-size="13" fill="#FF003C" opacity="0.12" filter="url(#glowSuit)">♥</text>
  <text x="770" y="185" font-size="14" fill="#FF003C" opacity="0.10" filter="url(#glowSuit)">♦</text>

  <!-- Main name -->
  <text x="450" y="85" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff" filter="url(#glow)">Luiz Fabiano</text>

  <!-- Subtitle -->
  <text x="450" y="118" text-anchor="middle" font-family="'Fira Code', 'Cascadia Code', monospace" font-size="14" fill="#b0b0b0" letter-spacing="1">
    <tspan fill="#9B30FF">♠</tspan>  Produto Tech  <tspan fill="#39FF14">•</tspan>  IA Aplicada  <tspan fill="#39FF14">•</tspan>  Automação  <tspan fill="#39FF14">•</tspan>  Dados  <tspan fill="#FF003C">♥</tspan>
  </text>

  <!-- @euLuizinho handle -->
  <text x="450" y="142" text-anchor="middle" font-family="'Fira Code', 'Cascadia Code', monospace" font-size="12" fill="#666" letter-spacing="2">@euLuizinho</text>

  <!-- Bottom wave/gradient line -->
  <path d="M0,185 Q150,170 300,180 T600,175 T900,185 L900,200 L0,200 Z" fill="url(#waveGrad)" opacity="0.5"/>
  <line x1="0" y1="195" x2="900" y2="195" stroke="url(#waveGrad)" stroke-width="1.5" opacity="0.4"/>
</svg>
