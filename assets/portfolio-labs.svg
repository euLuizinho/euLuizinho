      <stop offset="55%" stop-color="#14141C"/>
      <stop offset="100%" stop-color="#2E1023"/>
    </linearGradient>
    <clipPath id="plClip"><rect x="1" y="1" width="898" height="330" rx="16"/></clipPath>
