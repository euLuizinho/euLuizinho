      <text x="54" y="310" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#D4D4D8">Portal educativo de cibersegurança e simulador de phishing (<tspan fill="#FFFFFF" font-weight="600">HTML/CSS/JS</tspan> original · <tspan fill="#F9A8D4" font-weight="600">React &amp; Tailwind CSS</tspan>).</text>
