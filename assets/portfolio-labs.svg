      <text x="810" y="225.5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#09090D">&gt;30 FPS · SEM DL</text>
      <text x="54" y="246" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#D4D4D8">Arbitragem determinística de cartas em 1080p sem Deep Learning + jogo webcam (<tspan fill="#FFFFFF" font-weight="600">OpenCV, NumPy, HSV &amp; contornos</tspan>).</text>
