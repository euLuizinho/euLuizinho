      <g transform="translate(32, 227.5) scale(0.58)">
        <path d="M 0,-3.5 C -2,-8.5 -10,-8 -10,-1.5 C -10,4.5 -3.5,8 0,11 C 3.5,8 10,4.5 10,-1.5 C 10,-8 2,-8.5 0,-3.5 Z" fill="none" stroke="#FF2E93" stroke-width="2.0" stroke-linejoin="round"/>
